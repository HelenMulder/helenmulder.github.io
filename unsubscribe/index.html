<!DOCTYPE html><html><head><title>Unsubscribe | Helen Mulder OT</title>
<style>
:root { --accent: #2f6f86; --series-header: #6f8f86; }
body {
  font-family: Georgia, serif;
  max-width: 820px;
  margin: 36px auto;
  padding: 0 20px 60px;
  line-height: 1.78;
  font-size: 18px;
  color: #2e3130;
  background: #f6f5f4;
}
a { color: var(--accent); text-decoration: none; font-weight: 700; }
a:hover { text-decoration: underline; }
h1,h2,h3 { color:#23343b; letter-spacing: .15px; }
.hero { margin-bottom: 24px; padding: 18px 20px; background: linear-gradient(180deg, #ffffff 0%, #fbfaf9 100%); border: 1px solid #e7e3de; border-radius: 14px; }
.hero h1 { margin: 0; font-size: 2.05rem; }
.hero .tagline { margin: 8px 0 0; color: #6e6a66; font-size: 1.03rem; }
.series-panel { margin-top: 20px; background: #ffffff; border: 1px solid #e7e3de; border-radius: 14px; padding: 16px 16px 10px; box-shadow: 0 2px 14px rgba(35,52,59,0.04); }
.series-kicker { font-family: Helvetica, Arial, sans-serif; text-transform: uppercase; font-size: .72rem; letter-spacing: .08em; color: var(--series-header); margin-bottom: 6px; }
.series-title { margin: 0 0 6px; font-size: 1.34rem; }
.article-item { background: #fff; border: 1px solid #e7e3de; border-radius: 12px; padding: 12px 13px; margin: 10px 0; }
.article-item h3 { margin: 0 0 4px; font-size: 1.1rem; }
.article-item p { margin: 0; }
.card { background:#ffffff; border:1px solid #e7e3de; border-radius:12px; padding:14px; margin-bottom:12px; }
.meta,.small { color:#6e6a66; font-size:.98em; }
.topnav { margin-bottom:18px; }
@media (max-width: 780px) {
  body { font-size: 20px; line-height: 1.85; padding: 0 16px 56px; }
  .hero h1 { font-size: 2.25rem; }
  .series-title { font-size: 1.5rem; }
  .article-item h3 { font-size: 1.2rem; }
  .subscribe-row input, .subscribe-row button { font-size: 1rem; }
}
.subscribe-strip { margin-top: 24px; background: #ffffff; border: 1px solid #e7e3de; border-left: 4px solid var(--series-header); border-radius: 10px; padding: 14px; }
.subscribe-title { font-weight:700; margin-bottom:8px; }
.subscribe-row { display:flex; gap:8px; flex-wrap:wrap; }
.subscribe-row input { padding:9px 10px; border:1px solid #e7e3de; border-radius:7px; min-width:220px; }
.subscribe-row button { background:var(--accent); color:#fff; border:none; border-radius:7px; padding:9px 14px; cursor:pointer; }
.site-footer { margin-top: 26px; padding-top: 16px; border-top: 1px solid #e7e3de; }
</style></head><body>
<header class='hero'><h1>Unsubscribe</h1></header>
<section class='series-panel'>
<div class='subscribe-row'>
<input id='hm-unsub-email' type='email' placeholder='your@email.com' aria-label='Email address' />
<button onclick="hmUnsubscribe('hm-unsub-email','hm-unsub-status')">Unsubscribe</button>
</div>
<p id='hm-unsub-status' class='small' aria-live='polite'></p>
</section>

<footer class="site-footer">
  <div><strong>Helen Mulder OT</strong></div>
  <div class="small">Neuro-metabolic rehabilitation occupational therapist</div>
  <div class="small">Contact: <a href="mailto:helenjmulder@gmail.com">helenjmulder@gmail.com</a></div>
  <div class="small links"><a href="/">Home</a> · <a href="/recipes/index.html">Recipe Library</a> · <a href="/series/immune-drain/index.html">Immune Drain</a> · <a href="/series/signal-safety/index.html">Signal Safety</a></div>
</footer>


<script>
  window.HM_SUBSCRIBE_ENDPOINT = null;
  (async function() {
    try {
      const r = await fetch('/subscribe-config.json', {cache: 'no-store'});
      if (!r.ok) return;
      const cfg = await r.json();
      if (cfg && cfg.endpoint) window.HM_SUBSCRIBE_ENDPOINT = cfg.endpoint;
    } catch (_) {}
    // Auto-fill email if arriving from a one-click unsubscribe link (?email=...)
    try {
      const params = new URLSearchParams(window.location.search);
      const prefill = params.get('email');
      if (prefill) {
        const input = document.getElementById('hm-unsub-email');
        const status = document.getElementById('hm-unsub-status');
        if (input) input.value = prefill;
        if (status) status.textContent = 'Click "Unsubscribe" to confirm removal of ' + prefill + '.';
      }
    } catch (_) {}
  })();

  function hmEmailFallback(email, mode) {
    const subject = encodeURIComponent((mode === 'unsubscribe' ? 'Unsubscribe' : 'Subscribe') + ' - HelenMulder.com');
    const body = encodeURIComponent(
      (mode === 'unsubscribe' ? 'Please remove me from updates.\\n' : 'Please add me to new article alerts.\\n') +
      'My email: ' + email + '\\n(Source: ' + window.location.pathname + ')'
    );
    window.location.href = 'mailto:helenjmulder@gmail.com?subject=' + subject + '&body=' + body;
  }

  async function hmPostSubscription(mode, inputId, statusId) {
    const input = document.getElementById(inputId);
    const status = document.getElementById(statusId);
    const email = input && input.value ? input.value.trim() : '';
    if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
      if (status) status.textContent = 'Please enter a valid email.';
      return;
    }

    if (!window.HM_SUBSCRIBE_ENDPOINT) {
      if (status) status.textContent = 'Opening your email app...';
      hmEmailFallback(email, mode);
      return;
    }

    const payload = JSON.stringify({action: mode, email, source: window.location.pathname, ts: new Date().toISOString()});

    try {
      const response = await fetch(window.HM_SUBSCRIBE_ENDPOINT, {
        method: 'POST',
        redirect: 'follow',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: payload
      });
      if (!response.ok) throw new Error('http_' + response.status);
      if (status) status.textContent = (mode === 'unsubscribe') ? 'You are unsubscribed.' : 'Thanks — you are subscribed.';
      if (input) input.value = '';
    } catch (_) {
      try {
        await fetch(window.HM_SUBSCRIBE_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: payload
        });
        if (status) status.textContent = (mode === 'unsubscribe') ? 'You are unsubscribed.' : 'Thanks — you are subscribed.';
        if (input) input.value = '';
      } catch (_) {
        if (status) status.textContent = 'Opening your email app...';
        hmEmailFallback(email, mode);
      }
    }
  }

  async function hmSubscribe(inputId, statusId) { return hmPostSubscription('subscribe', inputId, statusId); }
  async function hmUnsubscribe(inputId, statusId) { return hmPostSubscription('unsubscribe', inputId, statusId); }
</script>

</body></html>
